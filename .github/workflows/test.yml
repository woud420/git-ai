name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-transport-probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/git-ai-transport-probe-target
      RUST_LOG: info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gnu-make
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - name: Prepare unchanged fork baseline
        shell: bash
        run: git worktree add ../baseline cd8c417649512f14b903eecb2c8ddd00d0c7e2f2
      - name: Baseline startup suite
        continue-on-error: true
        working-directory: ../baseline
        shell: bash
        run: make test CARGO_TEST_ARGS="--test async_mode" TEST_THREADS=4
      - name: Clear package artifacts before candidate
        if: always()
        shell: bash
        run: cargo clean -p git-ai
      - name: Candidate startup suite
        if: always()
        continue-on-error: true
        shell: bash
        run: make test CARGO_TEST_ARGS="--test async_mode" TEST_THREADS=4
      - name: Candidate notes transport suite independent of startup result
        if: always()
        shell: bash
        run: make test CARGO_TEST_ARGS="--test notes_sync_regression" TEST_THREADS=4
