name: Lint & Format

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/actions/setup-gnu-make/**'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/lint-format.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/actions/setup-gnu-make/**'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/lint-format.yml'
  merge_group:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GNU Make
        uses: ./.github/actions/setup-gnu-make

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: msrv
          components: rustfmt

      - run: make format-check

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GNU Make
        uses: ./.github/actions/setup-gnu-make

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: msrv
          components: clippy

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Test Rust toolchain resolution
        shell: bash
        run: python3 -m unittest discover -s .github/actions/setup-rust -p 'test_*.py'

      - run: make lint

  doc:
    name: Doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GNU Make
        uses: ./.github/actions/setup-gnu-make

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: msrv

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - run: make doc
