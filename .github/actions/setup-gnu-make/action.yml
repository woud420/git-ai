name: Set up GNU Make
description: Install and select the repository's GNU Make baseline

runs:
  using: composite
  steps:
    - name: Set GNU Make version
      shell: bash
      run: |
        echo "GNU_MAKE_VERSION=4.4.1" >> "$GITHUB_ENV"
        echo "GNU_MAKE_SHA256=dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3" >> "$GITHUB_ENV"

    - name: Install GNU Make (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # The path is derived only from the fixed, checksum-verified Make version above.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        archive="$RUNNER_TEMP/make-$GNU_MAKE_VERSION.tar.gz"
        source_dir="$RUNNER_TEMP/make-$GNU_MAKE_VERSION"
        prefix="$RUNNER_TEMP/gnu-make-$GNU_MAKE_VERSION"

        curl --fail --location --retry 3 \
          "https://ftp.gnu.org/gnu/make/make-$GNU_MAKE_VERSION.tar.gz" \
          --output "$archive"
        echo "$GNU_MAKE_SHA256  $archive" | sha256sum --check -
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
        cd "$source_dir"
        ./configure --prefix="$prefix"
        make --jobs 2
        make install
        echo "$prefix/bin" >> "$GITHUB_PATH"

    - name: Install GNU Make (macOS)
      if: runner.os == 'macOS'
      shell: bash
      # Homebrew returns its own installation prefix for the pinned package name.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        brew install make
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Install GNU Make (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # The community feed intermittently answers 5xx; one bad response
        # should not fail every Windows job before it builds anything.
        $attempts = 4
        for ($attempt = 1; $attempt -le $attempts; $attempt++) {
          choco install make --version=4.4.1 --no-progress --yes
          if ($LASTEXITCODE -eq 0 -or $attempt -eq $attempts) { break }
          $delay = 15 * [math]::Pow(2, $attempt - 1)
          Write-Host "choco install failed (exit $LASTEXITCODE); retrying in $delay s ($attempt/$attempts)"
          Start-Sleep -Seconds $delay
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify GNU Make (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        actual="$(make --version)"
        case "$actual" in
          "GNU Make "*) printf '%s\n' "$actual" ;;
          *) echo "Expected GNU Make, found $actual" >&2; exit 1 ;;
        esac
        # Reuse the repository's version floor, including newer Homebrew releases.
        make --no-print-directory -f "$GITHUB_ACTION_PATH/../../../Makefile" \
          --dry-run build TEST_THREADS=1

    - name: Verify GNU Make (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $actual = make --version | Select-Object -First 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $expected = "GNU Make 4.4.1"
        if ($actual -ne $expected) {
          throw "Expected $expected, found $actual"
        }
