name: Coverage

permissions:
  contents: read

# Temporarily disabled: daemon session timeouts under llvm-cov instrumentation
# cause flaky failures (~50% of runs). Needs retry logic or increased timeouts.
# See: https://github.com/git-ai-project/git-ai/pull/1178
on:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  # Coverage threshold is set to current coverage (54.10%) rounded down to nearest 5%
  # This ensures code coverage never falls below this baseline
  COVERAGE_THRESHOLD: 50

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: msrv
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run tests with coverage
        run: |
          cargo llvm-cov test \
            --ignore-filename-regex='tests/.*|benches/.*|examples/.*' \
            --lcov \
            --output-path lcov.info \
            --fail-under-lines $COVERAGE_THRESHOLD \
            -- --skip performance_regression

      - name: Generate HTML coverage report
        if: always()
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex='tests/.*|benches/.*|examples/.*' \
            --html \
            --output-dir target/coverage

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 30

      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 30
